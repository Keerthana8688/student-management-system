<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>
<body>

<h2>Student Management System</h2>

ID: <input type="text" id="sid"><br><br>
Name: <input type="text" id="sname"><br><br>
Course: <input type="text" id="course"><br><br>
Marks: <input type="number" id="marks"><br><br>

<button onclick="addStudent()">Add Student</button>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
        <th>Delete</th>
    </tr>
    <tbody id="data"></tbody>
</table>

<script>
function addStudent() {
    let table = document.getElementById("data");
    let row = table.insertRow();

    row.insertCell(0).innerHTML = document.getElementById("sid").value;
    row.insertCell(1).innerHTML = document.getElementById("sname").value;
    row.insertCell(2).innerHTML = document.getElementById("course").value;
    row.insertCell(3).innerHTML = document.getElementById("marks").value;
    row.insertCell(4).innerHTML =
        "<button onclick='del(this)'>Delete</button>";
}

function del(btn) {
    btn.parentNode.parentNode.remove();
}
</script>

</body>
</html>
